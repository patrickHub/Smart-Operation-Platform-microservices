spring:
  application:
    name: smartops-customer-app
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: customer
    default-schema: customer
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: customer
server:
  port: 8081
smartops:
  security:
    jwt:
      issuer: ${SMARTOPS_SECURITY_JWT_ISSUER:smartops-identity}
      secret: ${SMARTOPS_SECURITY_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
        
logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
