spring:
  application:
    name: smartops-customer-app
  datasource:
    url: jdbc:postgresql://localhost:5432/smartops
    username: smartops
    password: smartops
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: customer
    default-schema: customer
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: customer
server:
  port: 8081
smartops:
  security:
    jwt:
      issuer: smartops-identity
      secret: ${SMARTOPS_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
