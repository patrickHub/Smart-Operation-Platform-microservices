# Name displayed in the GitHub Actions tab
name: Backend CI

# Defines when this workflow should run
on:
  # Run the workflow when code is pushed
  push:
    # Only run for these branches/patterns
    branches:
      # Run when pushing to main branch
      - main

      # Run when pushing to develop branch
      - develop

      # Run when pushing to any feature branch, for example feature/add-ci
      - "feature/**"

      # Run when pushing to any fix branch, for example fix/docker-healthcheck
      - "fix/**"

      # Run when pushing to any chore branch, for example chore/devops-cleanup
      - "chore/**"

  # Run the workflow when a pull request is opened or updated
  pull_request:
    # Only run pull request checks targeting these branches
    branches:
      # Run CI when a pull request targets main
      - main

      # Run CI when a pull request targets develop
      - develop

# Defines the permissions given to the GitHub token during this workflow
permissions:
  # The workflow only needs read access to repository contents
  contents: read

# All jobs executed by this workflow
jobs:
  # First job: compile and test the backend with Maven
  backend-build:
    # Display name shown in GitHub Actions UI
    name: Build and Test Backend

    # Use the latest Ubuntu GitHub-hosted runner
    runs-on: ubuntu-latest

    # Steps are executed in order inside this job
    steps:
      # Download the repository source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Java 21 on the runner and enable Maven dependency cache
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          # Use Eclipse Temurin JDK distribution
          distribution: temurin

          # SmartOps backend uses Java 21
          java-version: 21

          # Cache Maven dependencies to make future builds faster
          cache: maven

      # Print Java and Maven versions to help debugging CI issues
      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      # Validate the Maven project structure and configuration
      - name: Validate Maven project
        run: mvn validate

      # Build all modules and run tests
      - name: Build and test backend
        run: mvn clean verify

  # Second job: validate Docker Compose configuration
  compose-validate:
    # Display name shown in GitHub Actions UI
    name: Validate Docker Compose

    # Use the latest Ubuntu GitHub-hosted runner
    runs-on: ubuntu-latest

    # This job starts only after backend-build succeeds
    needs: backend-build

    # Steps are executed in order inside this job
    steps:
      # Download the repository source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v6

      # Create a .env file for CI from the safe example file
      # docker compose automatically reads .env from the project root
      - name: Create CI .env file
        run: cp .env .env

      # Validate the final merged Docker Compose configuration
      # docker-compose.yml includes docker-compose.infra.yml and docker-compose.services.yml
      - name: Validate Docker Compose config
        run: docker compose config

  # Third job: build Docker images for all backend services
  docker-build:
    # Display name shown in GitHub Actions UI
    name: Build Docker Images

    # Use the latest Ubuntu GitHub-hosted runner
    runs-on: ubuntu-latest

    # This job starts only after backend-build and compose-validate succeed
    needs:
      - backend-build
      - compose-validate

    # Matrix allows the same Docker build steps to run for multiple services
    strategy:
      # If one service image fails, continue testing the other service images
      fail-fast: false

      # List of backend service modules to build as Docker images
      matrix:
        service:
          # API Gateway service
          - smartops-gateway-app

          # Identity and authentication service
          - smartops-identity-app

          # Customer management service
          - smartops-customer-app

          # Asset management service
          - smartops-asset-app

          # Work order management service
          - smartops-workorder-app

          # Billing and invoice service
          - smartops-billing-app

          # Notification service
          - smartops-notification-app

    # Steps are executed in order for each matrix service
    steps:
      # Download the repository source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Java 21 and enable Maven dependency cache
      # This is needed because Dockerfile.microservices copies built JAR files from target/
      - name: Set up Java 21
        uses: actions/setup-java@v
        with:
          # Use Eclipse Temurin JDK distribution
          distribution: temurin

          # SmartOps backend uses Java 21
          java-version: 21

          # Cache Maven dependencies to speed up Docker build job
          cache: maven

      # Build all backend JAR files before Docker image build
      # Tests already ran in backend-build, so we skip them here to save time
      - name: Build backend JARs
        run: mvn clean package -DskipTests

      # Enable Docker Buildx, the modern Docker builder used in CI
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image for the current service from the matrix
      - name: Build ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v6
        with:
          # Use repository root as Docker build context
          context: .

          # Use your shared Dockerfile for all microservices
          file: ./Dockerfile.microservices

          # Pass the current service module name to the Dockerfile
          build-args: |
            MODULE=${{ matrix.service }}

          # Do not push images yet; only validate that they can be built
          push: false

          # Local CI image tag
          tags: smartops/${{ matrix.service }}:ci