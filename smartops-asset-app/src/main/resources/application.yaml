spring:
  application:
    name: smartops-asset-app
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: asset
    default-schema: asset
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: asset

server:
  port: 8082

resilience4j:
  circuitbreaker:
    instances:
      customerService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - ch.smart.operations.platform.shared.exceptions.DownstreamClientException
  timelimiter:
    instances:
      customerService:
        timeoutDuration: 2s
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
smartops:
  services:
    customer:
      base-url: ${SMARTOPS_CUSTOMER_SERVICE_URL:http://localhost:8081}
  security:
    jwt:
      issuer: ${SMARTOPS_SECURITY_JWT_ISSUER:smartops-identity}
      secret: ${SMARTOPS_SECURITY_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    internal:
      service-name: ${SMARTOPS_SECURITY_INTERNAL_SERVICE_NAME:asset-service}
      token-validity-seconds: ${SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS:300}
      
logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
