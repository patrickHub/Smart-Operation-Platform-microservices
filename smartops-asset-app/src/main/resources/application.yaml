spring:
  application:
    name: smartops-asset-app
  datasource:
    url: jdbc:postgresql://localhost:5432/smartops
    username: smartops
    password: smartops
  lyway:
    enabled: true
    locations: classpath:db/migration
    schemas: asset
    default-schema: asset
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: asset
server:
  port: 8082

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
