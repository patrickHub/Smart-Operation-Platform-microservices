spring:
  application:
    name: smartops-workorder-app
  datasource:
    url: jdbc:postgresql://localhost:5432/smartops
    username: smartops
    password: smartops
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      client-id: smartops-workorder-app
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
smartops:
  services:
    asset:
      base-url: http://localhost:8082

  outbox:
    enabled: true
    polling-rate-ms: 5000
    max-attempts: 5

  kafka:
    topics:
      workorder-events: smartops.workorder.events
server:
  port: 8083

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
management:
  endpoints:
    web:
      exposure:
        include: health,info


