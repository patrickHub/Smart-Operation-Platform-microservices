spring:
  application:
    name: smartops-workorder-app
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: workorder
    default-schema: workorder
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: workorder

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      client-id: smartops-workorder-app
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
smartops:
  services:
    asset:
      base-url: ${SMARTOPS_ASSET_SERVICE_URL:http://localhost:8082}
  security:
    jwt:
      issuer: ${SMARTOPS_SECURITY_JWT_ISSUER:smartops-identity}
      secret: ${SMARTOPS_SECURITY_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    internal:
      service-name: ${SMARTOPS_SECURITY_INTERNAL_SERVICE_NAME:workorder-service}
      token-validity-seconds: ${SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS:300}

  outbox:
    enabled: true
    polling-rate-ms: 5000
    max-attempts: 5

  kafka:
    topics:
      workorder-events: smartops.workorder.events
server:
  port: 8083
  
resilience4j:
  circuitbreaker:
    instances:
      assetService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - ch.smart.operations.platform.shared.exceptions.DownstreamClientException

  timelimiter:
    instances:
      assetService:
        timeoutDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn



