spring:
  application:
    name: smartops-billing-app
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: billing
    default-schema: billing
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: billing
        
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      client-id: smartops-billing-app
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
smartops:
  services:
    workorder:
      base-url: ${SMARTOPS_WORKORDER_SERVICE_URL:http://localhost:8083}
  security:
    jwt:
      issuer: ${SMARTOPS_SECURITY_JWT_ISSUER:smartops-identity}
      secret: ${SMARTOPS_SECURITY_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    internal:
      service-name: ${SMARTOPS_SECURITY_INTERNAL_SERVICE_NAME:billing-service}
      token-validity-seconds: ${SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS:300}
  outbox:
    enabled: true
    polling-rate-ms: 5000
    max-attempts: 5

  kafka:
    topics:
      billing-events: smartops.billing.events
server:
  port: 8084

resilience4j:
  circuitbreaker:
    instances:
      workorderService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - ch.smart.operations.platform.shared.exceptions.DownstreamClientException

  timelimiter:
    instances:
      workorderService:
        timeoutDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn


