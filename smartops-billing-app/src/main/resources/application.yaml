spring:
  application:
    name: smartops-billing-app
  datasource:
    url: jdbc:postgresql://localhost:5432/smartops
    username: smartops
    password: smartops
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: billing
    default-schema: billing
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: billing
        
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      client-id: smartops-billing-app
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
smartops:
  services:
    workorder:
      base-url: http://localhost:8083
  security:
    jwt:
      issuer: smartops-identity
      secret: ${SMARTOPS_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}

  outbox:
    enabled: true
    polling-rate-ms: 5000
    max-attempts: 5

  kafka:
    topics:
      billing-events: smartops.billing.events
server:
  port: 8084

resilience4j:
  circuitbreaker:
    instances:
      workorderService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - ch.smart.operations.platform.shared.exceptions.DownstreamClientException

  timelimiter:
    instances:
      workorderService:
        timeoutDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn


