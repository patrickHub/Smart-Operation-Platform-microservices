services:
  postgres:
    image: postgres:15
    container_name: smartops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - smartops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smartops-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: smartops-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smartops-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: smartops-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: smartops-zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://smartops-kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server smartops-kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - smartops-network

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        MODULE: smartops-customer-app
    container_name: smartops-customer-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8081
      
      SPRING_DATASOURCE_URL: jdbc:postgresql://smartops-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS: customer
      SPRING_FLYWAY_DEFAULT_SCHEMA: customer
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_FLYWAY_TABLE: flyway_schema_history

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: customer
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"

      SMARTOPS_SECURITY_JWT_SECRET: ${SMARTOPS_SECURITY_JWT_SECRET}
      SMARTOPS_SECURITY_JWT_ISSUER: ${SMARTOPS_SECURITY_JWT_ISSUER}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "${CUSTOMER_SERVICE_PORT}:8081"
    networks:
      - smartops-network

  asset-service:
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        MODULE: smartops-asset-app
    container_name: smartops-asset-service
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://smartops-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_SCHEMAS: asset
      SPRING_FLYWAY_DEFAULT_SCHEMA: asset
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_FLYWAY_TABLE: flyway_schema_history
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: asset
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"

      SMARTOPS_SECURITY_JWT_SECRET: ${SMARTOPS_SECURITY_JWT_SECRET}
      SMARTOPS_SECURITY_JWT_ISSUER: ${SMARTOPS_SECURITY_JWT_ISSUER}
      SMARTOPS_SECURITY_INTERNAL_SERVICE_NAME: asset-service
      SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS: ${SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS}

      SMARTOPS_SERVICES_CUSTOMER_BASE_URL: http://customer-service:${CUSTOMER_SERVICE_PORT}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "${ASSET_SERVICE_PORT}:8082"
    networks:
      - smartops-network

  workorder-service:
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        MODULE: smartops-workorder-app
    container_name: smartops-workorder-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:postgresql://smartops-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_SCHEMAS: workorder
      SPRING_FLYWAY_DEFAULT_SCHEMA: workorder
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_FLYWAY_TABLE: flyway_schema_history
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: workorder
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"

      SMARTOPS_SECURITY_JWT_SECRET: ${SMARTOPS_SECURITY_JWT_SECRET}
      SMARTOPS_SECURITY_JWT_ISSUER: ${SMARTOPS_SECURITY_JWT_ISSUER}
      SMARTOPS_SECURITY_INTERNAL_SERVICE_NAME: workorder-service
      SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS: ${SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: smartops-kafka:9092
      SMARTOPS_SERVICES_ASSET_BASE_URL: http://asset-service:${ASSET_SERVICE_PORT}
      SMARTOPS_OUTBOX_ENABLED: "true"
      SMARTOPS_OUTBOX_POLLING_RATE_MS: 5000
      SMARTOPS_OUTBOX_MAX_ATTEMPTS: 5
      SMARTOPS_KAFKA_TOPICS_WORKORDER_EVENTS: smartops.workorder.events
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "${WORKORDER_SERVICE_PORT}:8083"
    networks:
      - smartops-network

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        MODULE: smartops-billing-app
    container_name: smartops-billing-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      workorder-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8084

      SPRING_DATASOURCE_URL: jdbc:postgresql://smartops-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_SCHEMAS: billing
      SPRING_FLYWAY_DEFAULT_SCHEMA: billing
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_FLYWAY_TABLE: flyway_schema_history
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: billing
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"

      SMARTOPS_SECURITY_JWT_SECRET: ${SMARTOPS_SECURITY_JWT_SECRET}
      SMARTOPS_SECURITY_JWT_ISSUER: ${SMARTOPS_SECURITY_JWT_ISSUER}
      SMARTOPS_SECURITY_INTERNAL_SERVICE_NAME: billing-service
      SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS: ${SMARTOPS_SECURITY_INTERNAL_TOKEN_VALIDITY_SECONDS}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: smartops-kafka:9092
      SMARTOPS_SERVICES_WORKORDER_BASE_URL: http://workorder-service:${WORKORDER_SERVICE_PORT}
      SMARTOPS_OUTBOX_ENABLED: "true"
      SMARTOPS_OUTBOX_POLLING_RATE_MS: 5000
      SMARTOPS_OUTBOX_MAX_ATTEMPTS: 5
      SMARTOPS_KAFKA_TOPICS_BILLING_EVENTS: smartops.billing.events
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "${BILLING_SERVICE_PORT}:8084"
    networks:
      - smartops-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        MODULE: smartops-notification-app
    container_name: smartops-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8085

      SPRING_DATASOURCE_URL: jdbc:postgresql://smartops-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_SCHEMAS: notification
      SPRING_FLYWAY_DEFAULT_SCHEMA: notification
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_FLYWAY_TABLE: flyway_schema_history
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: notification
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"

      SMARTOPS_SECURITY_JWT_SECRET: ${SMARTOPS_SECURITY_JWT_SECRET}
      SMARTOPS_SECURITY_JWT_ISSUER: ${SMARTOPS_SECURITY_JWT_ISSUER}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: smartops-kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: smartops-notification-service
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest

      SMARTOPS_KAFKA_CONSUMER_NOTIFICATION_GROUP: smartops-notification-service
      SMARTOPS_KAFKA_TOPICS_WORKORDER_EVENTS: smartops.workorder.events
      SMARTOPS_KAFKA_TOPICS_BILLING_EVENTS: smartops.billing.events
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8085"
    networks:
      - smartops-network
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        MODULE: smartops-identity-app
    container_name: smartops-identity-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8086

      SPRING_DATASOURCE_URL: jdbc:postgresql://smartops-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_SCHEMAS: identity
      SPRING_FLYWAY_DEFAULT_SCHEMA: identity
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_FLYWAY_TABLE: flyway_schema_history

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: identity
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_SHOW_SQL: "true"

      SMARTOPS_SECURITY_JWT_ISSUER: ${SMARTOPS_SECURITY_JWT_ISSUER}
      SMARTOPS_SECURITY_JWT_SECRET: ${SMARTOPS_SECURITY_JWT_SECRET}
      SMARTOPS_SECURITY_JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${SMARTOPS_SECURITY_JWT_ACCESS_TOKEN_VALIDITY_SECONDS}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "${IDENTITY_SERVICE_PORT}:8086"
    networks:
      - smartops-network
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        MODULE: smartops-gateway-app
    container_name: smartops-gateway-service
    depends_on:
      identity-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      workorder-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080

      SMARTOPS_IDENTITY_SERVICE_URL: http://identity-service:${IDENTITY_SERVICE_PORT}
      SMARTOPS_CUSTOMER_SERVICE_URL: http://customer-service:${CUSTOMER_SERVICE_PORT}
      SMARTOPS_ASSET_SERVICE_URL: http://asset-service:${ASSET_SERVICE_PORT}
      SMARTOPS_WORKORDER_SERVICE_URL: http://workorder-service:${WORKORDER_SERVICE_PORT}
      SMARTOPS_BILLING_SERVICE_URL: http://billing-service:${BILLING_SERVICE_PORT}
      SMARTOPS_NOTIFICATION_SERVICE_URL: http://notification-service:${NOTIFICATION_SERVICE_PORT}
      
      SMARTOPS_SECURITY_JWT_SECRET: ${SMARTOPS_SECURITY_JWT_SECRET} # We should keep issuer & secret the same as identity-service, because the gateway should validate tokens signed by identiy-service.
      SMARTOPS_SECURITY_JWT_ISSUER: ${SMARTOPS_SECURITY_JWT_ISSUER}

      SMARTOPS_ALLOWED_ORIGIN: ${SMARTOPS_ALLOWED_ORIGIN}
      SMARTOPS_CORS_ALLOWED_ORIGIN: ${SMARTOPS_ALLOWED_ORIGIN} # Spring will map it to smartops.cors.allowed-origin
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "${GATEWAY_SERVICE_PORT}:8080"
    networks:
      - smartops-network

volumes:
  smartops-postgres-data:

networks:
  smartops-network:
    driver: bridge