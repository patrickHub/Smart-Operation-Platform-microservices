spring:
  application:
    name: smartops-identity
  datasource:
    url: jdbc:postgresql://localhost:5432/smartops
    username: smartops
    password: smartops

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: identity
    default-schema: identity
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: identity
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

smartops:
  security:
    jwt:
      issuer: smartops-identity
      secret: ${SMARTOPS_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
      access-token-validity-seconds: 3600
server:
  port: 8086
logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
