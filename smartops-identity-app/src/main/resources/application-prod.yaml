spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false

smartops:
  security:
    jwt:
      issuer: ${SMARTOPS_SECURITY_JWT_ISSUER}
      secret: ${SMARTOPS_SECURITY_JWT_SECRET}
      access-token-validity-seconds: ${SMARTOPS_SECURITY_JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}