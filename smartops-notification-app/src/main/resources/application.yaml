spring:
  application:
    name: smartops-notification-app

  datasource:
    url: jdbc:postgresql://localhost:5432/smartops
    username: smartops
    password: smartops
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: smartops-notification-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

smartops:
  kafka:
    consumer:
      notification-group: smartops-notification-app

    topics:
      workorder-events: smartops.workorder.events
      billing-events: smartops.billing.events
server:
  port: 8085

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
management:
  endpoints:
    web:
      exposure:
        include: health,info