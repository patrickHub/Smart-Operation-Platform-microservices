spring:
  application:
    name: smartops-notification-app

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    default-schema: notification
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: notification

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: smartops-notification-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

smartops:
  kafka:
    consumer:
      notification-group: smartops-notification-app
  security:
    jwt:
      issuer: ${SMARTOPS_SECURITY_JWT_ISSUER:smartops-identity}
      secret: ${SMARTOPS_SECURITY_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}

    topics:
      workorder-events: smartops.workorder.events
      billing-events: smartops.billing.events
server:
  port: 8085

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
    
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true